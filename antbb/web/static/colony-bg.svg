  <use href="#ant" transform="translate(96 78) rotate(12) scale(.95)" opacity=".6"/>
  <use href="#ant" transform="translate(250 150) rotate(-24) scale(.8)" opacity=".5"/>
  <use href="#ant" transform="translate(410 96) rotate(190) scale(.9)" opacity=".55"/>
  <use href="#ant" transform="translate(150 300) rotate(70) scale(.85)" opacity=".5"/>
  <use href="#ant" transform="translate(360 330) rotate(-120) scale(1) " opacity=".55"/>

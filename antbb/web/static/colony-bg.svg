      <ellipse cx="0" cy="0" rx="7" ry="5"/>
      <ellipse cx="13" cy="0" rx="4.5" ry="3.8"/>
      <circle cx="22" cy="0" r="4"/>
      <line x1="25" y1="-2.5" x2="31" y2="-7"/>
      <line x1="25" y1="2.5" x2="31" y2="7"/>
      <line x1="12" y1="-1" x2="4" y2="-11"/>
      <line x1="13" y1="0" x2="2" y2="0"/>
      <line x1="12" y1="1" x2="4" y2="11"/>
      <line x1="14" y1="-1" x2="22" y2="-11"/>
      <line x1="15" y1="0" x2="26" y2="0"/>
      <line x1="14" y1="1" x2="22" y2="11"/>
    </g>
    <!-- gepunktete Pheromon-Spur -->
    <g id="trail" stroke="#394152" stroke-width="2.2" stroke-dasharray="1 13" stroke-linecap="round" fill="none"/>

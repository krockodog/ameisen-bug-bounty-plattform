{% extends "base.html" %}
{% block title %}Anmelden · antbb{% endblock %}
{% block content %}
<section class="card" style="max-width:420px;margin:2rem auto">
  <h2>🔐 Anmelden</h2>
  {% if error %}<p class="blocked">{{ error }}</p>{% endif %}
  <form method="post" action="/login">
    <input type="hidden" name="next" value="{{ next or '/' }}">
    <label>Benutzername<input name="username" required autofocus></label>
    <label>Passwort<input name="password" type="password" required></label>
    <button type="submit">Anmelden</button>
  </form>
  <p class="hint">Mehrbenutzer-/Login-Modus ist aktiv (ANTBB_AUTH=1).
    Rollen: admin / viewer. Passwörter werden nur gehasht gespeichert.</p>
</section>
{% endblock %}
